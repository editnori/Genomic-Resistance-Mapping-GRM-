[package]
name = "grm"
version = "0.2.0"
edition = "2024"
description = "Genomic Resistance Mapping: k-mer genotype-to-phenotype learning for antimicrobial resistance"
license = "MIT"
default-run = "grm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
# Saved predictions must round-trip at the precision used by metrics.
serde_json = { version = "1", features = ["float_roundtrip"] }
rustc-hash = "2"
rand = "0.9"
rand_chacha = "0.9"
# SHA-256 for research.json; ureq's TLS stack already builds it.
ring = "0.17"
ureq = "2"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
